name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-libs:
    name: Build Libs for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32, esp32s3, esp32c3]
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install dependencies
      run: bash ./tools/prepare-ci.sh

    - name: Build Libs for ${{ matrix.target }}
      # Pin both ESP-IDF commit and arduino-esp32 branch so the libs match
      # the framework-arduinoespressif32 3.3.3 package used downstream.
      # IDF release/v5.5 is a moving branch; tracking HEAD on it caused two
      # different breakages between 0.1.0 and 0.1.2:
      #   - newer IDF defines a public adc_continuous_data_t that collides
      #     with the Arduino core's internal type
      #   - newer arduino-esp32 master calls ble_gap_read_local_irk(), which
      #     does not exist in older IDF (only ble_store_read_local_irk)
      # Pin to the 0.1.0 versions, which are known to be mutually compatible.
      env:
        IDF_COMMIT: f1a1df9b2e
        AR_BRANCH: '3.3.3'
      run: bash ./build.sh -e -i "$IDF_COMMIT" -A "$AR_BRANCH" -t ${{ matrix.target }}

    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.target }}
        path: dist

  combine-artifacts:
    name: Combine artifacts
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true

      - shell: bash
        run: |
          mkdir -p out
          find dist -name 'arduino-esp32-libs-esp*.tar.gz' -exec tar zxvf {} -C out \;
          cd out/tools/esp32-arduino-libs && tar zcf ../../../dist/esp32-arduino-libs.tar.gz *

      - name: Upload full esp32-arduino-libs archive
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          name: esp32-arduino-libs
          files: dist/esp32-arduino-libs.tar.gz